<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes Center</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    
    <img class = "background-image" src="images/image3.png" alt="An orange Border image ">
    <img src="images/image1.png" alt="Motivational image with a quote">
    <h1>DJ's Notes Center</h1>
    
    <p>A place to keep my tasks , thoughts and tech notes ....</p>

    <section class="main-container">

        <h2>Create a New Post</h2>

        <form id="post-form">

            <label for="post-title">Title</label>
            <input type="text" id="post-title" name="post-title" placeholder="Enter a title">
            <span  id="title-error" class="error-message"></span>

            <label for="post-date">Date</label>
            <input type="date" id="post-date" name="post-date" >
            <span id ="date-error" class="error-message"></span>

            <label for="post-category">Category</label>
            <select id="post-category" name="post-category">
                <option value="">Select a category...</option>
                <option value="Things-to-do">Things to do</option>
                <option value="Daily-insights">Daily Insights</option>
                <option value="Tech">Tech</option>
            </select>

            <span id ="category-error" class="error-message"></span>

            <div>
                <label for="post-content">Content</label>
                <textarea id ="post-content" name="post-content" rows="8" placeholder ="Write your thoughts here..."></textarea>
            </div>

            <span id ="content-error" class="error-message"></span>

            <button type="submit" id ="publish-button">Publish Post</button>


        </form>
    </section>

    <section>

        <h2>My Posts</h2>

        <div id="posts-container"></div>
    </section>

</body>

</html>
