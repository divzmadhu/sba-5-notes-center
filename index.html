<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes Center</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>My Notes Center</h1>
    <!-- An Interactive Personal Blog Platform -->
    <p>A place to keep my tasks , thoughts and tech notes</p>

    <section class="main-container">
        <h2>Create a New Post</h2>

        <form id="post-form">

            <label for="post-title">Title</label>
            <input type="text" id="post-title" name="post-title" placeholder="Enter a title">
            <span  id="title-error"></span>

            <label for="post-date">Date</label>
            <input type="date" id="post-date" name="post-date" >
            <span id ="dateError"></span>

            <label for="post-category">Category</label>
            <select id="post-category" name="post-category">
                <option value="">Select a category...</option>
                <option value="things-to-do">Things to do</opton>
                <option value="daily-insights">Daily Insights</option>
                <option value="tech">Tech</option>
            </select>

            <span id ="categoryError"></span>

            <div>
                <label for="post-content">Content</label>
                <textarea id ="post-content" name="post-content" rows="8" placeholder ="Write your thoughts here..."></textarea>
            </div>

            <span id ="content-error"></span>

            <button type="submit" id ="publish-button">Publish Post</button>


        </form>
    </section>

    <section>

        <h2>My Posts</h2>

        <div id="posts-container"></div>
    </section>

</body>

</html>
